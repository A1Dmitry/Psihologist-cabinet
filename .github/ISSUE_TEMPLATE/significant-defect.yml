name: "Существенный дефект / системное исправление"
description: "Toyota Quality Gate: факт → причина → защита от повторения → Challenger → Main Re-Audit."
title: "[Defect] "
body:
  - type: markdown
    attributes:
      value: |
        Правила: [docs/RULES.md, §6](https://github.com/A1Dmitry/Psihologist-cabinet/blob/main/docs/RULES.md#6-toyota-quality-gate--замкнутый-контур-качества).
        P0/P1: немедленно объявите STOP THE LINE, не ждите окончания Root Cause.
        Неизвестное отмечайте «не установлено / не выполнено», укажите владельца и следующий шаг.
        Заполненная форма, merge и зелёный CI не доказывают завершение.
        Не публикуйте токены, секреты и персональные данные.
  - type: input
    id: executor
    attributes:
      label: "Исполнитель (EXEC-XXXXXXXXXX)"
      description: "Свой ID: `node tools/claim.mjs id`. Перед началом работы Issue обязателен claim: `node tools/claim.mjs take <номер>` (RULES §6.17, docs/EXECUTOR-CLAIMS.md)."
      placeholder: "EXEC-XXXXXXXXXX"
    validations:
      required: false
  - type: textarea
    id: goal
    attributes:
      label: "Цель"
      description: "Какой исходный результат должен быть достигнут? Без расширения продуктового scope."
      placeholder: "Ожидаемый результат и границы затронутого контура."
    validations:
      required: true
  - type: textarea
    id: defect
    attributes:
      label: "Факт дефекта"
      description: "Проверяемое наблюдение, не предположение."
      value: |
        Ожидаемое поведение:
        Фактическое поведение / симптом:
        Воздействие и затронутые пользователи/данные:
        Окружение / URL, дата, commit SHA (для production — развёрнутая версия):
        Предусловия и шаги воспроизведения:
        Доказательства / обезличенные логи:
        АУДИТОР: САМ — указать автора и дату; для внешней проверки — ВНЕШНИЙ, кто, дата, ссылка.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Приоритет: P0/P1/P2/P3"
      description: "Критерии — RULES §6.2. P3 требует полного разбора при повторении/системной причине."
      options:
        - "P0 — активная утечка, потеря данных, массовая недоступность"
        - "P1 — ключевой сценарий, безопасность/ownership, целостность"
        - "P2 — существенная некритическая ошибка с безопасным обходом"
        - "P3 — малое воздействие; здесь повторный/системный дефект"
    validations:
      required: true
  - type: textarea
    id: stop-the-line
    attributes:
      label: "Классификация / Andon / Stop the Line"
      description: "Для P0/P1 обязательна остановка. Для P2/P3 обоснуйте неприменимость остановки, но укажите владельца и риск."
      value: |
        Обоснование приоритета, неопределённость:
        Ответственный за контур / устранение (упоминание):
        Границы остановки и время объявления STOP THE LINE:
        Кому и когда сообщено:
        Containment: мера и статус (план / фактически выполнена):
        Проверка containment и доказательства:
        Остаточный риск, владелец и срок следующей проверки:
        Условия контролируемого merge/rollout исправления:
        Условия возобновления обычной работы после Main Re-Audit:
        Решение сопровождающего о возобновлении, дата и доказательства: не выполнено.
    validations:
      required: true
  - type: textarea
    id: root-cause
    attributes:
      label: "Root Cause / 5 Why"
      description: "Обязателен для существенного дефекта. Гипотезы отделяйте от доказанных причин; не выдумывайте пять ответов ради числа."
      value: |
        Симптом:
        Причинная цепочка (почему → наблюдение/доказательство):
        Почему контроль пропустил дефект:
        Неизвестное / гипотезы и план проверки с владельцем:
        Системное исправление:
        Предотвращение повторения и критерий эффективности:
    validations:
      required: true
  - type: textarea
    id: canonical-solution
    attributes:
      label: "Каноническое решение / Poka-Yoke"
      description: "Источник истины, его потребители, удаляемые копии; почему устраняется причина, а не симптом. Для процессного дефекта — каноническое правило."
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: "Архитектурные ограничения"
      description: "DRY/DDD/SOLID, границы domain/UI/адаптеров, серверное enforcement безопасности/ownership; изменения схемы через SR. Неприменимость обоснуйте."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: "Тестовый план и доказательства Producer"
      value: |
        Проверяемый SHA, окружение, автор и дата (АУДИТОР: САМ):
        Исходный дефект: шаги/команда, ожидаемый результат, fail до / pass после:
        Regression, соседние и негативные сценарии:
        E2E / фактическое поведение (для процесса — дефектный пример применения правил):
        Проверка архитектурных границ / отсутствия дублей:
        Попытки обхода / чужая и неавторизованная сессии (или обоснование неприменимости):
        Production-контур и развёрнутая версия (или обоснование неприменимости):
        Фактические результаты и ссылки на логи (не смешивать с планом):
        Непроверенные сценарии, блокеры и остаточные риски:
        Мог ли этот этап пройти успешно, пока исходная задача всё ещё нерешена?
        Ответ / контрпример и как он проверяется:
    validations:
      required: true
  - type: textarea
    id: challenger
    attributes:
      label: "Challenger-план / независимый аудит"
      description: "Другой проверяющий, не автор исправления. Повторная самопроверка и CI не заменяют аудит. До фактического отчёта gate открыт."
      value: |
        Независимый проверяющий (или не назначен: владелец назначения и следующий шаг):
        План самостоятельного воспроизведения и поиска контрпримеров/регрессий:
        Обход ограничений; сценарий «тест проходит, исходная задача не решена»:
        Фактический отчёт: не выполнен.
        При выполнении: АУДИТОР: ВНЕШНИЙ, идентификатор, дата, SHA, окружение, шаги и наблюдения, ссылка:
        Находки P0/P1/P2/P3, ограничения и повторная проверка после исправлений:
        Ответ на обязательный вопрос каждого этапа (§6.3):
        Итог по RULES §5:
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: "Definition of Done"
      description: "Дополните критериями исходной цели. Отмечайте только фактически выполненное; merge не закрывает Issue автоматически."
      value: |
        - [ ] Исходный дефект воспроизведён, приоритет и воздействие обоснованы.
        - [ ] Для P0/P1 выполнен Stop-the-Line, containment и остаточный риск зафиксированы (либо остановка обоснованно неприменима).
        - [ ] Root Cause / 5 Why подтверждён, объяснён пропуск контролем.
        - [ ] Каноническое исправление и защита Poka-Yoke внесены, архитектурные ограничения соблюдены.
        - [ ] Исходный, соседние и негативные сценарии проверены, приложены фактические доказательства.
        - [ ] Production-функции проверены в production-контуре (либо обоснована неприменимость).
        - [ ] Независимый Challenger провёл аудит актуального исправления, возражения устранены и перепроверены.
        - [ ] После merge выполнен Main Re-Audit актуального main с полным SHA и доказательствами.
        - [ ] Нет незакрытых P0/P1 в затронутом контуре; остановка снята по §6.2 (если объявлялась).
        - [ ] Kaizen / стандартизация выполнены, обязательная защита от повторения не отложена.
        - [ ] Итоговый отчёт содержит 12 разделов, маркер аудитора и статус по RULES; непроверенное не объявлено завершённым.
    validations:
      required: true
  - type: textarea
    id: main-re-audit
    attributes:
      label: "Main Re-Audit"
      description: "Обязателен после merge; проверка PR-ветки не засчитывается. До выполнения — Issue открыт."
      value: |
        Ответственный и план повторного аудита:
        Состояние: не выполнен (заполнить по факту после merge).
        Дата, источник актуального main и полный commit SHA:
        Доказательство присутствия исправления в этом SHA:
        Окружение / развёрнутая версия для production:
        Исходный дефектный сценарий: шаги, ожидаемое, фактическое, доказательства:
        Соседние / негативные сценарии и фактические результаты:
        Проверка отсутствия возврата дублей / архитектурных нарушений:
        Проверка актуальности main перед закрытием и границы вывода:
        Новые/незакрытые дефекты, Issue и блокеры:
        АУДИТОР: САМ или ВНЕШНИЙ (кто, дата, ссылка на фактический отчёт):
        Итоговый отчёт из 12 разделов и статус по RULES §5 (ссылка):
    validations:
      required: true
  - type: textarea
    id: kaizen
    attributes:
      label: "Kaizen / стандартизация"
      value: |
        Почему дефект возник:
        Почему обнаружен именно на этом этапе:
        Что изменено в правилах, архитектуре или автоматических тестах для раннего обнаружения/предотвращения (ссылки):
        Проверка защиты на исходном дефекте и критерий эффекта:
        Владелец проверки эффекта:
        Необязательные последующие улучшения (связанные Issue, владелец, срок):
    validations:
      required: true
