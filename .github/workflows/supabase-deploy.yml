name: Deploy Supabase Edge Functions

# Автодеплой Edge Functions при изменении их кода в main.
# Требует (одноразовая настройка владельцем, см. docs/INFRA.md):
#   Secret   SUPABASE_ACCESS_TOKEN — личный токен из supabase.com/dashboard/account/tokens
#   Variable SUPABASE_PROJECT_ID   — ref проекта (напр. phiavtroybgwyjdhqqkh)
#
# Честность статуса (#46 TASK 2 / #54-класс): раньше без секретов job печатал
# notice и оставался ЗЕЛЁНЫМ, хотя деплоя не было (3 таких прогона в истории при
# NOT_DEPLOYED в проде). Финальный шаг «Production reachability» всегда
# проверяет прод (публичная проверка, без секретов), но является advisory,
# когда секреты не настроены: живёт как warning, а не красный статус —
# прод-проверка честно логирует NOT_DEPLOYED, CI при этом не блокирует main.
# Когда секреты заданы и деплой выполнялся, неответ = красный (деплой не прошёл)
# — зелёный статус означает «endpoint поднят» (#35).
#
# Edge Functions: telegram-notify для уведомлений и telegram-auth для
# Telegram Mini App входа (HMAC initData + серверная привязка к существующему
# владельцу). Отменённая `auth-code` по-прежнему НЕ деплоится и не должна
# отвечать в проде; Telegram-вход реализован отдельным защищённым endpoint.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  # Деплой функций — тоже изменение production-контура: сначала проектный гейт.
  quality-gate:
    uses: ./.github/workflows/verify.yml

  deploy-functions:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Skip when credentials are not configured
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_ID == '' }}
        run: |
          echo "::notice::SUPABASE_ACCESS_TOKEN (secret) или SUPABASE_PROJECT_ID (variable) не заданы."
          echo "Деплой вручную: supabase functions deploy telegram-notify и telegram-auth (см. docs/INFRA.md)."
          echo "auth-code снята (#35/#88) и не деплоится; telegram-auth — отдельный путь входа Mini App."

      - name: Checkout
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        uses: supabase/setup-cli@v1

      # --no-verify-jwt продублирован флагом: функция вызывается анонимно,
      # до входа (см. supabase/config.toml — там же задокументирована модель
      # авторизации). `auth-code` намеренно НЕ деплоится: она снята (#35/#88).
      - name: Deploy functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          supabase functions deploy telegram-notify --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy telegram-auth --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      # Функция должна отвечать (не 404/401): пустой POST → 400 от
      # telegram-notify. Ранний детект случайного отката verify_jwt.
      # Плюс НАСТОЯЩИЙ браузерный preflight: именно он ломал вызов функции
      # («blocked by CORS policy … It does not have HTTP ok status»), а браузер
      # не показывает статус OPTIONS — поэтому проверяем его здесь.
      - name: Smoke check functions are reachable
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          for fn in telegram-notify; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${fn}" \
              -H "Content-Type: application/json" -d '{}')
            echo "$fn -> HTTP $code"
            if [ "$code" = "404" ] || [ "$code" = "401" ]; then
              echo "::error::$fn недоступна после деплоя (HTTP $code) — проверьте verify_jwt."; exit 1
            fi
          done
          # Для telegram-auth ожидаем прикладной 401 проверки initData;
          # gateway-401 имеет другое тело и означает неверный verify_jwt.
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/telegram-auth" \
            -H "Content-Type: application/json" -d '{}')
          auth_code=$(printf '%s' "$response" | tail -n1)
          auth_body=$(printf '%s' "$response" | sed '$d')
          echo "telegram-auth -> HTTP $auth_code (invalid initData probe)"
          if [ "$auth_code" != "401" ] || ! printf '%s' "$auth_body" | grep -q 'Некорректные данные Telegram'; then
            echo "::error::telegram-auth не прошла signed-initData smoke (HTTP $auth_code)."; exit 1
          fi

      # Preflight ровно как у браузера: OPTIONS + Origin приложения +
      # Access-Control-Request-*. Ожидание: 2xx и Allow-Origin/Allow-Methods.
      - name: Verify CORS preflight (browser-visible condition)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        env:
          ORIGIN: https://a1dmitry.github.io
        run: |
          for fn in telegram-notify telegram-auth; do
            hdrs=$(curl -s -D - -o /dev/null -X OPTIONS \
              "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${fn}" \
              -H "Origin: ${ORIGIN}" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: authorization, x-client-info, apikey, content-type")
            code=$(printf '%s' "$hdrs" | head -1 | tr -d '\r' | awk '{print $2}')
            allow_origin=$(printf '%s' "$hdrs" | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
            allow_methods=$(printf '%s' "$hdrs" | grep -i '^access-control-allow-methods:' | tr -d '\r' | cut -d' ' -f2-)
            echo "$fn preflight -> HTTP ${code} · allow-origin=${allow_origin:-—} · allow-methods=${allow_methods:-—}"
            if [ -z "$code" ] || [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::$fn: preflight OPTIONS вернул HTTP ${code:-нет ответа} — браузер заблокирует вызов (CORS)."; exit 1
            fi
            if [ -z "$allow_origin" ]; then
              echo "::error::$fn: в ответе на preflight нет Access-Control-Allow-Origin."; exit 1
            fi
            case "$allow_methods" in *POST*) : ;; *) echo "::error::$fn: Allow-Methods без POST ($allow_methods)."; exit 1 ;; esac
          done
          echo "Preflight OK: 2xx + CORS-заголовки на месте."

      # Публичная проверка фактического состояния прода — БЕЗ секретов, поэтому
      # выполняется всегда, включая путь «секреты не настроены». При отсутствии
      # секретов это advisory-проверка (warning, не fail) — CI остаётся зелёным,
      # но лог честно показывает NOT_DEPLOYED (блокер #35). Когда секреты заданы
      # и деплой выполнялся, неответ = красный (деплой не прошёл).
      - name: Production reachability (gateway 404 = NOT deployed, #35)
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID || 'phiavtroybgwyjdhqqkh' }}
          ORIGIN: https://a1dmitry.github.io
          HAS_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && vars.SUPABASE_PROJECT_ID != '' }}
        run: |
          missing=0
          revived=0
          unknown=0

          # curl при недоступности адреса сам печатает 000 и выходит ненулевым,
          # поэтому `|| echo 000` давал «000000» и ветка 000 никогда не
          # срабатывала (найденный дефект: «нет сети» читалось как «отвечает»).
          probe() {
            local c
            c=$(curl -s -o /dev/null -w "%{http_code}" "$@" || true)
            [ -n "$c" ] || c=000
            printf '%s' "$c"
          }

          # 1) Требуемая функция: telegram-notify обязана отвечать (не 404).
          for fn in telegram-notify telegram-auth; do
            code=$(probe -X POST \
              "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}" \
              -H "Content-Type: application/json" -d '{}')
            echo "$fn -> HTTP $code"
            case "$code" in
              404|000) missing=1 ;;
            esac
          done

          # 2) Браузерный preflight telegram-notify: 2xx + Access-Control-Allow-Origin.
          # Без него SPA не может вызвать функцию вообще («CORS-ошибка»).
          hdrs=$(curl -s -D - -o /dev/null -X OPTIONS \
            "https://${PROJECT_REF}.supabase.co/functions/v1/telegram-notify" \
            -H "Origin: ${ORIGIN}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization, x-client-info, apikey, content-type" || true)
          pcode=$(printf '%s' "$hdrs" | head -1 | tr -d '\r' | awk '{print $2}')
          porigin=$(printf '%s' "$hdrs" | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')
          echo "telegram-notify preflight -> HTTP ${pcode:-нет ответа} · allow-origin=${porigin:-—}"
          if [ -z "$pcode" ] || [ "$pcode" -lt 200 ] || [ "$pcode" -ge 300 ] || [ -z "$porigin" ]; then
            echo "preflight not ok: HTTP ${pcode:-нет ответа}, allow-origin=${porigin:-—}"
            missing=1
          fi

          # 3) Снятая функция: auth-code НЕ должна отвечать (#35 «must not be
          # deployed or restored», #88 — auth-code снята; web-вход Google + отдельный Telegram Mini App). Отсутствие
          # доказывается фактом gateway-404; «нет сети» (000) — это НЕ
          # доказательство отсутствия, а неизмеренность.
          retired_code=$(probe -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/auth-code" \
            -H "Content-Type: application/json" -d '{}')
          echo "auth-code (снята) -> HTTP $retired_code"
          case "$retired_code" in
            404) echo "auth-code отсутствует в проде — соответствует канону (#35/#88)." ;;
            # 000 = ответа не было вовсе: это НЕ доказательство отсутствия.
            # Считать такое «возрождением» нельзя — иначе мёртвая сеть красит
            # прогон ложным обвинением (тот же класс дефекта, что #54).
            000) echo "::notice::auth-code: ответ не получен (нет сети) — факт отсутствия НЕ измерен."; unknown=1 ;;
            *)   revived=1 ;;
          esac

          # Возрождение отменённого пути входа — красный ВСЕГДА, независимо от
          # секретов: это живая анонимная функция выдачи кодов, которой по канону
          # быть не должно. К «ожиданию владельца» это отношения не имеет.
          if [ "$revived" = "1" ]; then
            echo "::error::auth-code отвечает в проде (HTTP $retired_code) — возрождён отменённый путь входа. Канон: #35/#88 (auth-code — отменённый OTP-путь, Google + отдельный Telegram Mini App), функция не должна быть задеплоена."
            echo "::error::Действие владельца: Supabase Dashboard → Edge Functions → удалить auth-code (или supabase functions delete auth-code --project-ref ${PROJECT_REF})."
            exit 1
          fi

          if [ "$missing" = "1" ]; then
            if [ "$HAS_SECRETS" = "true" ]; then
              echo "::error::telegram-notify не отвечает в проде (404/нет сети/preflight): деплой не выполнен или откатился. Блокер #35."
              echo "::error::Действие владельца: docs/TELEGRAM-MINIAPP-AUTH.md + docs/OWNER-CHECKLIST-E2E.md (секреты Supabase; deploy telegram-notify и telegram-auth)."
              exit 1
            else
              echo "::warning::telegram-notify не отвечает в проде (404/нет сети/preflight): деплой не выполнен — требуется действие владельца (блокер #35). CI остаётся зелёным (advisory), прод-проверка — в прод-зонде."
              echo "::notice::Действие владельца: docs/OWNER-CHECKLIST-E2E.md, Блок 1. Факт NOT_DEPLOYED зафиксирован в логе, но не красит ветку красным до настройки секретов."
              exit 0
            fi
          fi
          if [ "$unknown" = "1" ]; then
            echo "::warning::Прод-состояние измерено не полностью: по снятой auth-code ответа не получили. Это не «всё чисто»."
          fi
          echo "telegram-notify и telegram-auth отвечают в проде, снятая auth-code отсутствует — статус зелёный обоснован."
