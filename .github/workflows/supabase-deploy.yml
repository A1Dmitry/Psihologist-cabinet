name: Deploy Supabase Edge Functions

# Автодеплой Edge Functions при изменении их кода в main.
# Требует (одноразовая настройка владельцем, см. docs/INFRA.md):
#   Secret   SUPABASE_ACCESS_TOKEN — личный токен из supabase.com/dashboard/account/tokens
#   Variable SUPABASE_PROJECT_ID   — ref проекта (напр. phiavtroybgwyjdhqqkh)
# Без них job завершается успешно с пояснением (деплой руками через CLI).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Skip when credentials are not configured
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_ID == '' }}
        run: |
          echo "::notice::SUPABASE_ACCESS_TOKEN (secret) или SUPABASE_PROJECT_ID (variable) не заданы."
          echo "Деплой вручную: supabase functions deploy auth-code telegram-notify (см. docs/INFRA.md)."

      - name: Checkout
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        uses: supabase/setup-cli@v1

      # --no-verify-jwt продублирован флагом: функции вызываются до входа/анонимно
      # (см. supabase/config.toml — там же задокументирована модель авторизации).
      - name: Deploy functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          supabase functions deploy auth-code --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy telegram-notify --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      # Функции должны отвечать (не 404/401): пустой POST → 400 от auth-code,
      # 400 от telegram-notify. Ранний детект случайного отката verify_jwt.
      - name: Smoke check functions are reachable
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          for fn in auth-code telegram-notify; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${fn}" \
              -H "Content-Type: application/json" -d '{}')
            echo "$fn -> HTTP $code"
            if [ "$code" = "404" ] || [ "$code" = "401" ]; then
              echo "::error::$fn недоступна после деплоя (HTTP $code) — проверьте verify_jwt."; exit 1
            fi
          done
