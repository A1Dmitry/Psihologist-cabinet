name: Production read-only probe

# Read-only инспекция production Supabase (issue #46, TASK 1/2/5).
#
# Зачем отдельный workflow: у исполнителя в песочнице нет egress до
# `*.supabase.co` (TLS обрывается, curl → exit 35), а канал без секретов
# владельца — это PostgREST/GoTrue с ПУБЛИЧНЫМ anon key. Runner GitHub имеет
# сеть, поэтому фактическое состояние прода снимается здесь и попадает в лог
# запуска как evidence (issue #46, TASK 6).
#
# Секретов НЕ требует и не использует: только публичный anon key из
# js/services/supabaseConfig.js (он опубликован в собранном сайте).
# Запуски — вручную (workflow_dispatch) или по расписанию: это диагностика,
# а не гейт, поэтому на push/main он не висит и сборку не красит.

on:
  # На PR: новый workflow невозможно задиспетчить из ветки (workflow_dispatch
  # GitHub принимает только для файлов, которые уже есть в default branch),
  # поэтому evidence для конкретной ветки снимается прогоном на pull_request.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    # раз в сутки, чтобы drift в проде был виден без ручного запуска
    - cron: '35 6 * * *'

permissions:
  contents: read
  # отчёт публикуется комментарием к PR: логи run'а из песочницы исполнителя
  # не скачиваются (egress до results-receiver.actions.githubusercontent.com
  # закрыт), а api.github.com доступен — поэтому evidence живёт в PR.
  pull-requests: write

concurrency:
  group: prod-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Человекочитаемый отчёт — в лог запуска.
      - name: Run read-only production probe
        run: node tools/prod-probe/probe.mjs | tee /tmp/prod-probe-report.txt

      # Тот же прогон машиночитаемым JSON — артефактом, чтобы отчёт можно было
      # приложить к issue/re-audit без копипасты из лога.
      - name: Save JSON report
        run: node tools/prod-probe/probe.mjs --json > /tmp/prod-probe-report.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-probe-report
          path: /tmp/prod-probe-report.json
          if-no-files-found: ignore
          retention-days: 30

      # #54: «нет ответа» — это отсутствие evidence, а не благополучный прод.
      # Без этого шага отчёт с `drift 0` при мёртвой сети читался как «чисто».
      - name: Verify the probe actually measured production
        run: |
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/prod-probe-report.json', 'utf8'));
            const s = r.summary;
            console.log('измерено: ' + s.measured + '/' + s.probes + ' · недоступно: ' + s.unreachable);
            if (s.unreachable > 0) {
              console.error('::error::probe не измерил прод сполна (недоступно зондов: ' + s.unreachable +
                '): ' + (s.unreachable_items || []).slice(0, 5).join(', '));
              process.exit(1);
            }
          "

      # Evidence — комментарием к PR (см. блок permissions).
      - name: Publish evidence to pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## Production read-only probe (issue #46, TASK 1/2/5)"
            echo
            echo "Канал: PostgREST/GoTrue с публичным anon key. Секреты не использовались."
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} · SHA: \`${SHA}\` · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```text'
            cat /tmp/prod-probe-report.txt
            echo '```'
          } > /tmp/prod-probe-comment.md
          gh pr comment "$PR" --body-file /tmp/prod-probe-comment.md
